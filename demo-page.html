<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-title" content="範例商店">
<title>範例商店 | Demo Shop</title>
<style>
  body{margin:0;font-family:-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;background:#fff;color:#222}
  header{position:sticky;top:0;background:#ee4d2d;color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
  .hero{margin:12px;height:150px;border-radius:14px;background:linear-gradient(135deg,#ff8a3d,#ee4d2d);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 80px}
  .card{border-radius:12px;background:#f5f5f5;height:180px;display:flex;align-items:flex-end;padding:10px;font-size:14px}
  button{margin:0 12px 12px;width:calc(100% - 24px);height:44px;border:0;border-radius:10px;background:#222;color:#fff;font-size:15px}
  nav{position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;font-size:12px}
</style>
</head>
<body>
<header>範例商店</header>
<div class="hero">雙 11 限時優惠</div>
<button onclick="this.textContent='已點擊 ✓ ' + new Date().toLocaleTimeString()">點我測試點擊</button>
<div class="grid">
  <div class="card">商品 1</div><div class="card">商品 2</div><div class="card">商品 3</div>
  <div class="card">商品 4</div><div class="card">商品 5</div><div class="card">商品 6</div>
</div>
<nav><span>首頁</span><span>分類</span><span>購物車</span><span>我的</span></nav>
</body>
</html>
